name: build-custom
on:
  push:
    branches: [reasoning-toggle]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install & Build
        run: |
          cd packages/opencode
          bun install 2>&1
          bun run build --single --skip-embed-web-ui 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: packages/opencode/dist/opencode-*/bin/opencode
