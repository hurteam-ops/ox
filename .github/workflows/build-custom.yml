name: build-custom
on:
  push:
    branches: [reasoning-toggle]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      # Install deps for the specific package, not root (avoids ghostty-web issue)
      - name: Install dependencies
        run: |
          cd packages/opencode
          bun install --frozen-lockfile 2>&1 || bun install 2>&1

      # Build the opencode CLI binary
      - name: Build
        run: |
          cd packages/opencode
          bun run build --skip-embed-web-ui --skip-install 2>&1 || bun run build --skip-embed-web-ui 2>&1

      # Upload the built binary
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.os }}
          path: |
            packages/opencode/dist/opencode-*/bin/opencode*
            packages/opencode/dist/opencode-*/bin/opencode.exe
